# The design proposal specifies containerised environments as the target deployment.
# Docker Compose provides reproducibility: any reviewer can spin up the exact same
# PostgreSQL + pgvector version used during development with a single command.
# The pgvector image ships PostgreSQL 16 with the pgvector
# extension pre-installed, avoiding manual compilation.

services:
  db:
    image: pgvector/pgvector:pg16
    # pgvector/pgvector:pg16 = PostgreSQL 16 + pgvector extension pre-installed
    # Source: https://github.com/pgvector/pgvector#docker
    container_name: concept_genealogy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: concept_genealogy
    ports:
      - "5429:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d concept_genealogy"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concept_genealogy_backend
    restart: unless-stopped
    ports:
      - "7999:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/concept_genealogy
    env_file:
      - backend/.env
    volumes:
      - ./backend/output:/app/output
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: concept_genealogy_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local